name: OSS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the official v<version> release instead of creating a draft test release"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos
            runner: macos-14
            target: aarch64-apple-darwin
            nemotron: true
            extra_args: --features nemotron --config ./src-tauri/tauri.nemotron.conf.json
          - name: macOS Intel
            platform: macos
            runner: macos-14
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          VERSION=$(jq -r '.version' ./apps/desktop/src-tauri/tauri.conf.json)
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            EXPECTED_TAG="v${VERSION}"
            if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "::error::Tag ${TAG_NAME} does not match app version ${VERSION}"
              exit 1
            fi
            echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${DISPATCH_PUBLISH}" == "true" ]]; then
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=oss-test-v${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Refuse overwriting a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --exit-status --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | all(.draft)' > /dev/null

      - uses: arduino/setup-protoc@v3
        with:
          version: "25.7"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.1"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Read release changes
        id: changes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release-notes.mjs

      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup target add ${{ matrix.target }}
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Build frontend packages
        run: |
          pnpm -F @typr/desktop lingui:compile
          pnpm -F @typr/fonts build
          pnpm -F @typr/ui build
        shell: bash

      - name: Build MCP sidecar
        run: ./scripts/build_mcp_sidecar.sh ${{ matrix.target }}
        shell: bash

      - uses: ./.github/actions/apple_cert
        if: ${{ matrix.platform == 'macos' }}
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Create Apple API key file
        if: ${{ matrix.platform == 'macos' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_P8_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
        env:
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Prepare portable Nemotron runtime
        if: matrix.nemotron
        run: python3 scripts/build_nemotron_runtime.py
        shell: bash

      - name: Sign Nemotron runtime
        if: matrix.nemotron
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 scripts/verify_nemotron_bundle.py sign target/nemotron/runtime
        shell: bash

      - name: Build signed and notarized app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ steps.release.outputs.tag }}
          CODESIGN_TIMESTAMP_URL: "http://timestamp.apple.com/ts01"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.conf.stable.json ${{ matrix.extra_args }} --verbose
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Typr OSS v${{ steps.release.outputs.version }}
          releaseBody: ${{ steps.changes.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          retryAttempts: 2
          includeUpdaterJson: true

      - name: Verify macOS signature and notarization
        if: ${{ matrix.platform == 'macos' }}
        run: |
          APP_PATH="./apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Typr OSS.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
        shell: bash

      - name: Verify bundled Nemotron and bilingual transcription
        if: matrix.nemotron
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          python3 scripts/verify_nemotron_bundle.py verify "./apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Typr OSS.app"
        shell: bash

      - name: Verify Windows installer
        if: ${{ matrix.platform == 'windows' }}
        run: |
          NSIS_DIR="./apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          echo "Checking Windows installer output in $NSIS_DIR"
          ls -la "$NSIS_DIR"
          test -n "$(find "$NSIS_DIR" -maxdepth 1 -name '*.exe' -print -quit)"
        shell: bash

  publish:
    name: Validate updater and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check complete signed updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/updater-check"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag and .draft)] | if length == 1 then .[0] else error("Expected one matching draft release") end' > "$RUNNER_TEMP/updater-check/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --pattern '*.sig' --pattern '*.app.tar.gz' --pattern '*.exe' --dir "$RUNNER_TEMP/updater-check"
          sudo apt-get update -qq && sudo apt-get install -y minisign
          node scripts/check-release-updater.mjs "$RUNNER_TEMP/updater-check" "$GITHUB_REPOSITORY" "$RELEASE_VERSION" "$RELEASE_TAG"
      - name: Publish verified official release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
