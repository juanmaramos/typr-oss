name: Desktop plugin

on:
  pull_request:
    paths:
      - 'integrations/openai/**'
      - 'scripts/*desktop_plugin.py'
      - 'crates/mcp-server/**'
      - 'crates/db-core/**'
      - 'crates/db-user/**'
      - 'plugins/listener-interface/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-plugin.yaml'
      - '.github/actions/apple_cert/**'
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign and notarize macOS ZIPs (artifacts only; no release or submission)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Plugin ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: typr-mcp
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: typr-mcp
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: typr-mcp.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-protoc@v3
        with:
          version: '25.7'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-plugin-${{ matrix.target }}
      - name: Set temporary package output
        shell: bash
        # Generated packages must not be restored by the Cargo target cache.
        run: echo "TYPR_PLUGIN_OUTPUT=$RUNNER_TEMP/typr-desktop-plugin-${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Check package contract
        run: python scripts/test_desktop_plugin.py
      - name: Test and build the existing Rust server
        shell: bash
        run: |
          cargo +1.93.0 test --locked -p typr-mcp-server
          cargo +1.93.0 build --locked --release --target ${{ matrix.target }} -p typr-mcp-server --bin typr-mcp
      - name: Copy executable outside the build cache
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/typr-plugin-executable"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$RUNNER_TEMP/typr-plugin-executable/${{ matrix.binary }}"
      - name: Import Developer ID certificate
        id: apple-cert
        if: github.event_name == 'workflow_dispatch' && inputs.sign_macos && runner.os == 'macOS'
        uses: ./.github/actions/apple_cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Sign native macOS executable
        if: github.event_name == 'workflow_dispatch' && inputs.sign_macos && runner.os == 'macOS'
        env:
          SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}
        run: |
          codesign --force --sign "$SIGNING_IDENTITY" --options runtime --timestamp --identifier com.typr.oss.mcp "$RUNNER_TEMP/typr-plugin-executable/typr-mcp"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/typr-plugin-executable/typr-mcp"
      - name: Package and verify native retrieval
        shell: bash
        run: |
          python scripts/package_desktop_plugin.py --binary "$RUNNER_TEMP/typr-plugin-executable/${{ matrix.binary }}" --target ${{ matrix.target }} --output "$TYPR_PLUGIN_OUTPUT"
          python crates/mcp-server/tests/stdio.py "$TYPR_PLUGIN_OUTPUT/typr-local/bin/${{ matrix.binary }}"
      - name: Notarize the exact macOS ZIP and assess the packaged executable
        if: github.event_name == 'workflow_dispatch' && inputs.sign_macos && runner.os == 'macOS'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/typr-plugin-notary"
          printf '%s' "$APPLE_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/typr-plugin-notary/AuthKey.p8"
          ARCHIVE="$TYPR_PLUGIN_OUTPUT/typr-local-${{ matrix.target }}.zip"
          DIGEST=$(shasum -a 256 "$ARCHIVE" | cut -d ' ' -f 1)
          xcrun notarytool submit "$ARCHIVE" --key "$RUNNER_TEMP/typr-plugin-notary/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/typr-plugin-notary/result.json"
          python scripts/verify_desktop_plugin.py "$ARCHIVE" --result "$RUNNER_TEMP/typr-plugin-notary/result.json" --sha256 "$DIGEST" --receipt "$TYPR_PLUGIN_OUTPUT/notarization.json"
          codesign --verify --strict --verbose=2 "$TYPR_PLUGIN_OUTPUT/typr-local/bin/typr-mcp"
          spctl --assess --type execute --verbose=2 "$TYPR_PLUGIN_OUTPUT/typr-local/bin/typr-mcp"
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: '22'
      - name: Install pinned Codex test host
        if: runner.os == 'macOS'
        run: npm install --global --ignore-scripts @openai/codex@0.146.0
      - name: Install ZIP in clean host and retrieve fixture notes
        if: runner.os == 'macOS'
        run: python crates/mcp-server/tests/stdio.py "$TYPR_PLUGIN_OUTPUT/typr-local/bin/${{ matrix.binary }}" --plugin "$TYPR_PLUGIN_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: typr-desktop-plugin-${{ matrix.target }}-${{ github.event_name == 'workflow_dispatch' && inputs.sign_macos && runner.os == 'macOS' && 'signed-notarized' || 'unsigned' }}
          path: |
            ${{ env.TYPR_PLUGIN_OUTPUT }}/typr-local-${{ matrix.target }}.zip
            ${{ env.TYPR_PLUGIN_OUTPUT }}/.agents
            ${{ env.TYPR_PLUGIN_OUTPUT }}/notarization.json
          include-hidden-files: true
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always() && github.event_name == 'workflow_dispatch' && inputs.sign_macos && runner.os == 'macOS'
        run: |
          rm -f certificate.p12 "$RUNNER_TEMP/typr-plugin-notary/AuthKey.p8"
          security delete-keychain build.keychain || true
