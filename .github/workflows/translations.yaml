name: Translations

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test translation enforcement
        run: pnpm test:i18n
      - name: Test desktop localization and shared UI runtime
        run: pnpm test:health
      - name: Check UI source and English/Spanish catalogs
        run: pnpm i18n:check
